<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
        </filter>
    </defs>
    <!-- Background Frame -->
    <rect x="10" y="10" width="760" height="420" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header Bar -->
    <rect x="10" y="10" width="760" height="64" rx="12" fill="#f8fafc" stroke="#e3e6ec" stroke-width="1.5"/>
    <rect x="10" y="60" width="760" height="14" fill="#f8fafc"/>
    
    <!-- Window Control Dots -->
    <circle cx="36" cy="38" r="6" fill="#ff5f56"/>
    <circle cx="56" cy="38" r="6" fill="#ffbd2e"/>
    <circle cx="76" cy="38" r="6" fill="#27c93f"/>
    
    <!-- Badge & Title -->
    <rect x="100" y="26" width="130" height="26" rx="6" fill="#28a745" fill-opacity="0.15"/>
    <text x="165" y="44" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#28a745" text-anchor="middle">CHART TREND</text>
    <text x="245" y="44" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Biểu Đồ Xu Hướng Tăng Trưởng Clicks &amp; Doanh Thu</text>
    
    <!-- Content Elements -->
    <rect x='40' y='110' width='700' height='54' rx='8' fill='#ffffff' stroke='#dee2e6' stroke-width='1.5'/>
<circle cx='65' cy='137' r='6' fill='#28a745'/>
<text x='85' y='143' font-family='Inter, Arial, sans-serif' font-size='14' font-weight='500' fill='#212529'>📈 Đường Clicks: Tăng 24% | Đường Doanh Thu: 12,450,000 VND | TikTok Organic: Chiếm 68%</text>
<rect x='40' y='178' width='700' height='46' rx='6' fill='#e8f4fd' stroke='#bee5eb' stroke-width='1.5'/>
<text x='60' y='206' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='600' fill='#0c5460'>💡 Biểu đồ trực quan giúp nhận diện kênh phân phối hiệu quả nhất</text>

</svg>