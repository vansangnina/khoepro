<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
        </filter>
    </defs>
    <!-- Background Frame -->
    <rect x="10" y="10" width="760" height="420" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header Bar -->
    <rect x="10" y="10" width="760" height="64" rx="12" fill="#f8fafc" stroke="#e3e6ec" stroke-width="1.5"/>
    <rect x="10" y="60" width="760" height="14" fill="#f8fafc"/>
    
    <!-- Window Control Dots -->
    <circle cx="36" cy="38" r="6" fill="#ff5f56"/>
    <circle cx="56" cy="38" r="6" fill="#ffbd2e"/>
    <circle cx="76" cy="38" r="6" fill="#27c93f"/>
    
    <!-- Badge & Title -->
    <rect x="100" y="26" width="130" height="26" rx="6" fill="#007bff" fill-opacity="0.15"/>
    <text x="165" y="44" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#007bff" text-anchor="middle">CREATE A/B TEST</text>
    <text x="245" y="44" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Tạo Thử Nghiệm A/B Mới Cho Biến Thể Kịch Bản</text>
    
    <!-- Content Elements -->
    <rect x='40' y='110' width='700' height='60' rx='8' fill='#f8f9fa' stroke='#ced4da' stroke-width='1.5'/>
<text x='55' y='145' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='500' fill='#495057'>Biến thể A: Hook Tò mò (&quot;Bạn có chắc mình đang Squat đúng cách?&quot;) | CTA: Mua ngay</text>
<rect x='40' y='185' width='700' height='60' rx='8' fill='#f8f9fa' stroke='#ced4da' stroke-width='1.5'/>
<text x='55' y='220' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='500' fill='#495057'>Biến thể B: Hook Cảnh báo (&quot;90% Gymer chấn thương lưng vì lỗi này!&quot;) | CTA: Nhận ưu đãi</text>
<rect x='40' y='260' width='320' height='46' rx='6' fill='#28a745' stroke='#28a745' stroke-width='1'/>
<text x='55' y='288' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='600' fill='#ffffff'>🧪 BẮT ĐẦU THỬ NGHIỆM A/B</text>
<rect x='40' y='320' width='700' height='46' rx='6' fill='#e8f4fd' stroke='#bee5eb' stroke-width='1.5'/>
<text x='60' y='348' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='600' fill='#0c5460'>💡 Hai biến thể sẽ được đăng luân phiên để đo lường công bằng</text>

</svg>