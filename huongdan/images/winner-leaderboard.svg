<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
        </filter>
    </defs>
    <!-- Background Frame -->
    <rect x="10" y="10" width="760" height="420" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header Bar -->
    <rect x="10" y="10" width="760" height="64" rx="12" fill="#f8fafc" stroke="#e3e6ec" stroke-width="1.5"/>
    <rect x="10" y="60" width="760" height="14" fill="#f8fafc"/>
    
    <!-- Window Control Dots -->
    <circle cx="36" cy="38" r="6" fill="#ff5f56"/>
    <circle cx="56" cy="38" r="6" fill="#ffbd2e"/>
    <circle cx="76" cy="38" r="6" fill="#27c93f"/>
    
    <!-- Badge & Title -->
    <rect x="100" y="26" width="130" height="26" rx="6" fill="#ffc107" fill-opacity="0.15"/>
    <text x="165" y="44" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffc107" text-anchor="middle">WINNER LEADERBOARD</text>
    <text x="245" y="44" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Bảng Xếp Hạng Sản Phẩm Thắng (Winner Leaderboard)</text>
    
    <!-- Content Elements -->
    <rect x='40' y='110' width='700' height='168' rx='8' fill='#ffffff' stroke='#ced4da' stroke-width='1.5'/>
<rect x='40' y='110' width='700' height='36' rx='8' fill='#e9ecef'/>
<text x='55' y='133' font-family='Inter, Arial, sans-serif' font-size='12' font-weight='600' fill='#495057'>TÊN HẠNG MỤC / SẢN PHẨM</text>
<text x='360' y='133' font-family='Inter, Arial, sans-serif' font-size='12' font-weight='600' fill='#495057'>NGUỒN / THÔNG SỐ</text>
<text x='560' y='133' font-family='Inter, Arial, sans-serif' font-size='12' font-weight='600' fill='#495057'>TRẠNG THÁI</text>
<line x1='40' y1='150' x2='740' y2='150' stroke='#dee2e6' stroke-width='1'/>
<text x='55' y='172' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='500' fill='#212529'>⭐ Đai lưng da bò Aolikes 10mm</text>
<text x='360' y='172' font-family='Inter, Arial, sans-serif' font-size='12' font-weight='500' fill='#6c757d'>1,450 clicks</text>
<text x='560' y='172' font-family='Inter, Arial, sans-serif' font-size='12' font-weight='600' fill='#28a745'>CR 5.4%</text>
<line x1='40' y1='194' x2='740' y2='194' stroke='#dee2e6' stroke-width='1'/>
<text x='55' y='216' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='500' fill='#212529'>⭐ Dây kháng lực ngũ sắc FITPRO</text>
<text x='360' y='216' font-family='Inter, Arial, sans-serif' font-size='12' font-weight='500' fill='#6c757d'>980 clicks</text>
<text x='560' y='216' font-family='Inter, Arial, sans-serif' font-size='12' font-weight='600' fill='#28a745'>CR 4.3%</text>
<line x1='40' y1='238' x2='740' y2='238' stroke='#dee2e6' stroke-width='1'/>
<text x='55' y='260' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='500' fill='#212529'>Bình lắc giữ nhiệt Stainless Steel</text>
<text x='360' y='260' font-family='Inter, Arial, sans-serif' font-size='12' font-weight='500' fill='#6c757d'>320 clicks</text>
<text x='560' y='260' font-family='Inter, Arial, sans-serif' font-size='12' font-weight='600' fill='#28a745'>CR 2.5%</text>
<rect x='40' y='292' width='700' height='46' rx='6' fill='#e8f4fd' stroke='#bee5eb' stroke-width='1.5'/>
<text x='60' y='320' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='600' fill='#0c5460'>💡 Sản phẩm vượt ngưỡng CR &gt; 4% tự động được gắn cờ WINNER</text>

</svg>