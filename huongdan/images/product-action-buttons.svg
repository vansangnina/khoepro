<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
        </filter>
    </defs>
    <!-- Background Frame -->
    <rect x="10" y="10" width="760" height="420" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header Bar -->
    <rect x="10" y="10" width="760" height="64" rx="12" fill="#f8fafc" stroke="#e3e6ec" stroke-width="1.5"/>
    <rect x="10" y="60" width="760" height="14" fill="#f8fafc"/>
    
    <!-- Window Control Dots -->
    <circle cx="36" cy="38" r="6" fill="#ff5f56"/>
    <circle cx="56" cy="38" r="6" fill="#ffbd2e"/>
    <circle cx="76" cy="38" r="6" fill="#27c93f"/>
    
    <!-- Badge & Title -->
    <rect x="100" y="26" width="130" height="26" rx="6" fill="#6c757d" fill-opacity="0.15"/>
    <text x="165" y="44" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#6c757d" text-anchor="middle">ACTION BUTTONS</text>
    <text x="245" y="44" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Cột Thao Tác: Sửa, Sao Chép (Copy) &amp; Xóa Sản Phẩm</text>
    
    <!-- Content Elements -->
    <rect x='40' y='110' width='320' height='46' rx='6' fill='#007bff' stroke='#007bff' stroke-width='1'/>
<text x='55' y='138' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='600' fill='#ffffff'>✏️ Chỉnh sửa</text>
<rect x='40' y='170' width='320' height='46' rx='6' fill='#17a2b8' stroke='#17a2b8' stroke-width='1'/>
<text x='55' y='198' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='600' fill='#ffffff'>📋 Sao chép (Copy)</text>
<rect x='40' y='230' width='320' height='46' rx='6' fill='#dc3545' stroke='#dc3545' stroke-width='1'/>
<text x='55' y='258' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='600' fill='#ffffff'>🗑️ Xóa</text>
<rect x='40' y='290' width='700' height='46' rx='6' fill='#e8f4fd' stroke='#bee5eb' stroke-width='1.5'/>
<text x='60' y='318' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='600' fill='#0c5460'>💡 Thao tác thuận tiện ngay trên từng dòng sản phẩm</text>

</svg>