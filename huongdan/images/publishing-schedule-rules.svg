<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
        </filter>
    </defs>
    <!-- Background Frame -->
    <rect x="10" y="10" width="760" height="420" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header Bar -->
    <rect x="10" y="10" width="760" height="64" rx="12" fill="#f8fafc" stroke="#e3e6ec" stroke-width="1.5"/>
    <rect x="10" y="60" width="760" height="14" fill="#f8fafc"/>
    
    <!-- Window Control Dots -->
    <circle cx="36" cy="38" r="6" fill="#ff5f56"/>
    <circle cx="56" cy="38" r="6" fill="#ffbd2e"/>
    <circle cx="76" cy="38" r="6" fill="#27c93f"/>
    
    <!-- Badge & Title -->
    <rect x="100" y="26" width="130" height="26" rx="6" fill="#6f42c1" fill-opacity="0.15"/>
    <text x="165" y="44" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#6f42c1" text-anchor="middle">SCHEDULE RULES</text>
    <text x="245" y="44" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Cấu Hình Quy Tắc Lập Lịch &amp; Thời Gian Giãn Cách (Cooldown)</text>
    
    <!-- Content Elements -->
    <rect x='40' y='110' width='700' height='54' rx='8' fill='#ffffff' stroke='#dee2e6' stroke-width='1.5'/>
<circle cx='65' cy='137' r='6' fill='#6f42c1'/>
<text x='85' y='143' font-family='Inter, Arial, sans-serif' font-size='14' font-weight='500' fill='#212529'>Hạn mức kênh (Daily Quota): 3 bài/ngày/tài khoản</text>
<rect x='40' y='178' width='700' height='54' rx='8' fill='#ffffff' stroke='#dee2e6' stroke-width='1.5'/>
<circle cx='65' cy='205' r='6' fill='#6f42c1'/>
<text x='85' y='211' font-family='Inter, Arial, sans-serif' font-size='14' font-weight='500' fill='#212529'>Khung giờ vàng: 11:30 - 13:00 (Trưa) | 19:30 - 21:30 (Tối)</text>
<rect x='40' y='246' width='700' height='54' rx='8' fill='#ffffff' stroke='#dee2e6' stroke-width='1.5'/>
<circle cx='65' cy='273' r='6' fill='#6f42c1'/>
<text x='85' y='279' font-family='Inter, Arial, sans-serif' font-size='14' font-weight='500' fill='#212529'>Giãn cách (Cooldown): Tối thiểu 120 phút giữa 2 bài đăng liên tiếp cùng kênh</text>
<rect x='40' y='314' width='700' height='46' rx='6' fill='#e8f4fd' stroke='#bee5eb' stroke-width='1.5'/>
<text x='60' y='342' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='600' fill='#0c5460'>💡 Đảm bảo đăng đều đặn, tối đa tương tác và tránh thuật toán spam của mạng xã hội</text>

</svg>