<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
        </filter>
    </defs>
    <!-- Background Frame -->
    <rect x="10" y="10" width="760" height="420" rx="12" fill="#ffffff" stroke="#e3e6ec" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header Bar -->
    <rect x="10" y="10" width="760" height="64" rx="12" fill="#f8fafc" stroke="#e3e6ec" stroke-width="1.5"/>
    <rect x="10" y="60" width="760" height="14" fill="#f8fafc"/>
    
    <!-- Window Control Dots -->
    <circle cx="36" cy="38" r="6" fill="#ff5f56"/>
    <circle cx="56" cy="38" r="6" fill="#ffbd2e"/>
    <circle cx="76" cy="38" r="6" fill="#27c93f"/>
    
    <!-- Badge & Title -->
    <rect x="100" y="26" width="130" height="26" rx="6" fill="#28a745" fill-opacity="0.15"/>
    <text x="165" y="44" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#28a745" text-anchor="middle">POLICY BADGES</text>
    <text x="245" y="44" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Huy Hiệu Phân Loại Policy Gate (PASS / WARNING / FAIL)</text>
    
    <!-- Content Elements -->
    <rect x='40' y='110' width='500' height='40' rx='6' fill='#28a745' fill-opacity='0.15' stroke='#28a745' stroke-width='1.5'/>
<text x='60' y='135' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='600' fill='#28a745'>🟢 PASS: Đạt 100% tiêu chuẩn - Sẵn sàng xuất bản ngay</text>
<rect x='40' y='162' width='500' height='40' rx='6' fill='#ffc107' fill-opacity='0.15' stroke='#ffc107' stroke-width='1.5'/>
<text x='60' y='187' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='600' fill='#ffc107'>🟡 WARNING: Có từ nhạy cảm nhẹ - Tự động khử độc (Sanitize) hoặc duyệt tay</text>
<rect x='40' y='214' width='500' height='40' rx='6' fill='#dc3545' fill-opacity='0.15' stroke='#dc3545' stroke-width='1.5'/>
<text x='60' y='239' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='600' fill='#dc3545'>🔴 FAIL: Vi phạm nghiêm trọng từ cấm - Chặn đăng hoàn toàn</text>
<rect x='40' y='266' width='700' height='46' rx='6' fill='#e8f4fd' stroke='#bee5eb' stroke-width='1.5'/>
<text x='60' y='294' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='600' fill='#0c5460'>💡 Chỉ các nội dung đạt PASS hoặc WARNING đã sửa mới được vào Approved Pool</text>

</svg>